# SHARED CI CORE v1.0 — T1 — synced 2026-08-22
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12", primary: true}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Sync the test environment
      # Primary cell installs uv.lock exactly; floating cells test today's resolution.
      # Retried because observed failures here are transport failures, not test failures.
      shell: bash
      run: |
        sync_cmd=(uv sync --group test ${{ matrix.primary && '--locked' || '--upgrade' }})
        for attempt in 1 2 3; do
          if "${sync_cmd[@]}"; then exit 0; fi
          if [ "$attempt" -eq 3 ]; then echo "::error::uv sync failed after 3 attempts"; exit 1; fi
          delay=$((attempt * 30 - 15))
          echo "::warning::uv sync attempt $attempt failed; retrying in ${delay}s"
          sleep "$delay"
        done

    - name: Run tests
      run: uv run --no-sync pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"

    - name: Check lint and import boundaries
      run: uv run --locked --only-group lint ruff check .

  wheel:
    name: built wheel (core install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"

    - name: Build the wheel from the source distribution
      run: |
        uv build --sdist --clear --out-dir dist
        uv build --wheel dist/*.tar.gz --out-dir dist

    - name: Assert distribution contents
      run: |
        uv run --no-project python - <<'PY'
        from pathlib import Path

        wheels = list(Path("dist").glob("*.whl"))
        sdists = list(Path("dist").glob("*.tar.gz"))
        assert len(wheels) == 1, wheels
        assert len(sdists) == 1, sdists
        PY
        uv run --no-project python scripts/check_dist_contents.py 'dist/*'

    - name: Install the wheel into a clean environment
      run: |
        uv venv --python 3.12 "$RUNNER_TEMP/gba-wheel"
        uv pip install --python "$RUNNER_TEMP/gba-wheel/bin/python" "$(ls dist/*.whl)"

    - name: Exercise the installed wheel from outside the checkout
      working-directory: ${{ runner.temp }}
      run: |
        mkdir -p "$RUNNER_TEMP/wheelcheck"
        cp "$GITHUB_WORKSPACE/examples/getting_started/quickstart.py" \
          "$RUNNER_TEMP/wheelcheck/quickstart.py"
        cd "$RUNNER_TEMP/wheelcheck"
        "$RUNNER_TEMP/gba-wheel/bin/python" quickstart.py
        uv pip check --python "$RUNNER_TEMP/gba-wheel/bin/python"
        "$RUNNER_TEMP/gba-wheel/bin/python" -c "from pathlib import Path; import goal_based_allocation as package; checkout = Path(r'${{ github.workspace }}').resolve(); package_path = Path(package.__file__).resolve(); assert not package_path.is_relative_to(checkout), (checkout, package_path); print(f'wheel_import={package_path}')"

    - name: Test source distribution outside the checkout
      run: |
        uv venv --python 3.12 "$RUNNER_TEMP/gba-sdist"
        uv pip install --python "$RUNNER_TEMP/gba-sdist/bin/python" dist/*.tar.gz
        cp "$GITHUB_WORKSPACE/examples/getting_started/quickstart.py" \
          "$RUNNER_TEMP/sdist-quickstart.py"
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/gba-sdist/bin/python" sdist-quickstart.py
        uv pip check --python "$RUNNER_TEMP/gba-sdist/bin/python"
        "$RUNNER_TEMP/gba-sdist/bin/python" -c "from pathlib import Path; import goal_based_allocation as package; checkout = Path(r'${{ github.workspace }}').resolve(); package_path = Path(package.__file__).resolve(); assert not package_path.is_relative_to(checkout), (checkout, package_path); print(f'sdist_import={package_path}')"
