# SHARED CI CORE v1.2 — T1 — synced 2026-09-08
name: Documentation

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      online:
        type: boolean
        default: false
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"

    - name: Sync documentation environment
      run: uv sync --locked --extra docs

    - name: Verify redirect path and fragment handling
      run: uv run --no-sync python .github/scripts/test_docs_redirects.py

    - name: Build documentation with the shared profile

      run: uv run --no-sync python .github/oss_checks.py docs --working-tree --output-dir "$RUNNER_TEMP/oss-docs"

    - name: Check documentation links

      if: inputs.online || github.event_name == 'workflow_dispatch'
      run: uv run --no-sync python -m sphinx -E -W -b linkcheck docs docs/_build/linkcheck

    # Publish only redirects on GitHub Pages; Read the Docs serves the full site.
    - name: Build legacy documentation redirects
      run: >-
        uv run --no-sync python .github/scripts/build_docs_redirects.py
        --source "$RUNNER_TEMP/oss-docs/html"
        --output docs/_build/redirects
        --base-url https://goalbasedallocation.readthedocs.io/en/latest/
        --project-prefix /GoalBasedAllocation/

    - name: Upload Pages artifact
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' && vars.ENABLE_PAGES == 'true'
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
      with:
        path: docs/_build/redirects

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' && vars.ENABLE_PAGES == 'true'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
